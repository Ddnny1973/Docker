upstream odoo38 {
    server 10.0.0.2:8038;
}

upstream odoo38-longpolling {
    server 10.0.0.2:8078;
}

server {
    server_name gc-pruebas.gestorconsultoria.com.co;
    
    # Aumentar tamaño de buffer para headers
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;
    
    # Aumentar tamaño máximo de carga
    client_max_body_size 100M;
    
    # Logs
    access_log /var/log/nginx/odoo38-access.log;
    error_log /var/log/nginx/odoo38-error.log;
    
    # Longpolling
    location /longpolling {
        proxy_pass http://odoo38-longpolling;
        proxy_redirect off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }
    
    # Aplicación principal
    location / {
        proxy_pass http://odoo38;
        proxy_redirect off;
        
        # Headers necesarios para Odoo detrás de proxy
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # Timeouts
        proxy_connect_timeout 3600;
        proxy_send_timeout 3600;
        proxy_read_timeout 3600;
        send_timeout 3600;
        
        # Buffers
        proxy_buffering off;
        proxy_request_buffering off;
    }
    
    # Archivos estáticos con caché
    location ~* /web/static/ {
        proxy_pass http://odoo38;
        proxy_cache_valid 200 60m;
        proxy_buffering on;
        expires 864000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 80; 
}

