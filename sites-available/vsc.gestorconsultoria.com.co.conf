server {
    listen 443 ssl http2;
    server_name vsc.gestorconsultoria.com.co;

    ssl_certificate /etc/letsencrypt/live/vsc.gestorconsultoria.com.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vsc.gestorconsultoria.com.co/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        # 👇 Aquí apuntas a la IP del servidor donde corre el contenedor
        proxy_pass http://10.0.0.2:8034;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_buffering off;
    }

    # 🔐 Opcional: autenticación básica (recomendado)
    auth_basic "Acceso restringido";
    auth_basic_user_file /etc/nginx/.htpasswd;

    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval' blob: data:;" always;
}

server {
    listen 80;
    server_name vsc.gestorconsultoria.com.co;
    return 301 https://$host$request_uri;
}
