
    server {
        server_name analytics.gestorconsultoria.com.co;
        location / {
            proxy_pass http://10.0.0.2:8039;
            proxy_redirect off;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        #return 301 https://aserprem.com.co$request_uri;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/analytics.gestorconsultoria.com.co/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/analytics.gestorconsultoria.com.co/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

    server {
    if ($host = analytics.gestorconsultoria.com.co) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


        server_name analytics.gestorconsultoria.com.co;


    listen 80;
    return 404; # managed by Certbot


}