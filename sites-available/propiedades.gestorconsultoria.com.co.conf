    server {
	server_name propiedades.gestorconsultoria.com.co;
	location / {
	    proxy_pass http://10.0.0.2:8035;
	    proxy_redirect off;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;




    } 


    # Websocket de Odoo (Odoo 18: /websocket?version=...)
    location /websocket {
        proxy_pass http://10.0.0.2:8072;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 720s;
        proxy_send_timeout 720s;
        proxy_buffering off;
    }


    # (Opcional pero recomendado) fallback/compat
    location /longpolling {
        proxy_pass http://10.0.0.2:8072;
        proxy_redirect off;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 720s;
        proxy_send_timeout 720s;
        proxy_buffering off;
    }


    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/propiedades.gestorconsultoria.com.co/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/propiedades.gestorconsultoria.com.co/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
    server {
    if ($host = propiedades.gestorconsultoria.com.co) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


	server_name propiedades.gestorconsultoria.com.co;


    listen 80;
    return 404; # managed by Certbot


}
