name: Auto-Deploy to Docker Alma Server

on:
  push:
    branches:
      - trunk

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/ci-deploy
          chmod 600 ~/.ssh/ci-deploy
          ssh-keyscan -H 2.29.11.73 >> ~/.ssh/known_hosts
      
      - name: Sync files to server (safe, no delete)
        run: |
          rsync -avz \
            --exclude='.git/' \
            --exclude-from=.gitignore \
            -e "ssh -i ~/.ssh/ci-deploy -o StrictHostKeyChecking=no" \
            . \
            root@2.29.11.73:/data/odoo/
      
      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/ci-deploy
