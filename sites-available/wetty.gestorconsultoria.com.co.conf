    server {
	server_name wetty.gestorconsultoria.com.co;
	location / {
	    proxy_pass http://10.0.0.2:8033;
	    proxy_redirect off;
	    proxy_set_header Host $host;
	    proxy_set_header X-Real-IP $remote_addr;
	#return 301 https://aserprem.com.co$request_uri;
	add_header 'Content-Security-Policy' 'upgrade-insecure-requests';	
    }


    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/wetty.gestorconsultoria.com.co/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/wetty.gestorconsultoria.com.co/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    auth_basic "Acceso restringido";
    auth_basic_user_file /etc/nginx/.htpasswd;

}
    server {
    if ($host = wetty.gestorconsultoria.com.co) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


	server_name wetty.gestorconsultoria.com.co;


    listen 80;
    return 404; # managed by Certbot


}
