services:
  web:
    image: odoo:18
    user: root
    restart: "always"
    depends_on:
      db-42:
        condition: service_healthy
    ports:
     - "8042:8069"
     - "8090:8072"
    environment:
     - HOST=db-42
     - PORT=5432
     - USER=odoo
     - PASSWORD=odoo
     - POSTGRES_DB=odoo
     - ODOO_WORKERS=2
     - ODOO_LONGPOLLING_PORT=8072
    volumes:
     - ./config:/etc/odoo
     - ./filestore:/var/lib/odoo/filestore
     - ./extra-addons:/mnt/extra-addons
     - ./postgresql/data/compartida:/mnt/compartida
     - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
     test: curl --fail http://localhost:8069 || exit 1
     interval: 30s
     timeout: 10s
     retries: 5

  db-42:
    image: postgres:16
    restart: "always"
    ports:
     - "9042:5432"
    volumes:
     - ./postgresql/data:/var/lib/postgresql/data
    environment:
     - POSTGRES_DB=odoo
     - POSTGRES_PASSWORD=odoo
     - POSTGRES_USER=odoo
    healthcheck:
     test: ["CMD-SHELL", "pg_isready -U odoo"]
     interval: 30s
     timeout: 5s
     retries: 5
