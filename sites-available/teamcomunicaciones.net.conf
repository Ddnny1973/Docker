server {
    server_name www.teamcomunicaciones.net teamcomunicaciones.net;
    location / {
        #proxy_pass http://192.168.100.200:8016;
	#proxy_pass http://192.168.120.12:6016;
	proxy_pass http://10.0.0.2:8016;

        proxy_redirect off;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;

	# Adición para error Exception: bus.Bus unavailable
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 7200s; # Tiempo de espera extendido para conexiones WebSocket



    }


    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/www.teamcomunicaciones.net/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/www.teamcomunicaciones.net/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot





}

server {
    if ($host = www.teamcomunicaciones.net) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = teamcomunicaciones.net) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name www.teamcomunicaciones.net teamcomunicaciones.net;

location /longpolling {
        proxy_pass http://10.0.0.4:8016;
    }

    listen 80;
    return 404; # managed by Certbot

}
