services:
  web:
    image: dpage/pgadmin4
    restart: "always"
    ports:
     - 8010:80
    environment:
     - PGADMIN_DEFAULT_EMAIL=danielpatinofernandez@gmail.com
     - PGADMIN_DEFAULT_PASSWORD=urantia73
    volumes:
     - ./private/var/lib/pgadmin:/var/lib/pgadmin
     - ./tmp/servers.json:/pgadmin4/servers.json
     - ./sessions:/var/lib/pgadmin4/sessions
     - ./storage:/var/lib/pgadmin4/storage
     - ./init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
     test: curl --fail http://localhost || exit 1
     interval: 5m00s
     timeout: 20s
     retries: 3
