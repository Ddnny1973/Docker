server {
    server_name agente.gestorconsultoria.com.co;

    location / {
        proxy_pass http://10.0.0.2:8040;

        # Identidad del cliente
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Forzar WebSockets (Aquí eliminamos el 'map' y lo ponemos fijo)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Connection "upgrade"; # <--- ESTO ES LO QUE ELIMINA EL PAIRING
        proxy_set_header X-Forwarded-Host $host;

        # Evitar cortes de conexión
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        
        proxy_redirect off;
        add_header 'Content-Security-Policy' 'upgrade-insecure-requests';
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/agente.gestorconsultoria.com.co/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/agente.gestorconsultoria.com.co/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = agente.gestorconsultoria.com.co) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name agente.gestorconsultoria.com.co;
    return 404; # managed by Certbot


}
