name: Auto-Deploy to Docker Alma Server

on:
  push:
    branches:
      - trunk

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 2.29.11.73
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          timeout: 600s
          script: |
            set -e
            cd /data/odoo
            
            echo "==> Pulling latest code from trunk..."
            git pull origin trunk
            
            echo "==> Starting all services..."
            docker compose up -d
            
            echo "==> Deployment complete"
            docker compose ps
