server {
    server_name ai-mindnovation.com www.ai-mindnovation.com;
    location / {
        proxy_pass http://10.0.0.5:8030;
        proxy_redirect off;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto 'https';
	add_header 'Content-Security-Policy' 'upgrade-insecure-requests';

    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/www.ai-mindnovation.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/www.ai-mindnovation.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot




}
server {
    if ($host = www.ai-mindnovation.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name www.ai-mindnovation.com;

    listen 80;
    return 404; # managed by Certbot


}
