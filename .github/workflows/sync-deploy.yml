name: Sync Deploy Files

on:
  push:
    branches: [trunk]
    paths:
      - '35/**'
      - '36/**'
      - '37/**'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/ci-deploy
          chmod 600 ~/.ssh/ci-deploy
          ssh-keyscan -H 2.29.11.73 >> ~/.ssh/known_hosts

      - name: Sync 35
        run: |
          scp -i ~/.ssh/ci-deploy -o StrictHostKeyChecking=no \
            35/docker-compose.yml \
            root@2.29.11.73:/data/odoo/35/docker-compose.yml
          scp -i ~/.ssh/ci-deploy -o StrictHostKeyChecking=no -r \
            35/config/ \
            root@2.29.11.73:/data/odoo/35/config/

      - name: Sync 36
        run: |
          scp -i ~/.ssh/ci-deploy -o StrictHostKeyChecking=no \
            36/docker-compose.yml \
            root@2.29.11.73:/data/odoo/36/docker-compose.yml

      - name: Sync 37
        run: |
          scp -i ~/.ssh/ci-deploy -o StrictHostKeyChecking=no \
            37/docker-compose.yml \
            root@2.29.11.73:/data/odoo/37/docker-compose.yml
          scp -i ~/.ssh/ci-deploy -o StrictHostKeyChecking=no -r \
            37/config/ \
            root@2.29.11.73:/data/odoo/37/config/

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/ci-deploy
